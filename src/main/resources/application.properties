spring.application.name=RaceHorse_Transport


# Thông tin Driver và URL kết nối
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Chú ý: Thay thế 'localhost', '1433' và 'ten_database' bằng thông tin server của bạn
# Tham số encrypt=true;trustServerCertificate=true; giúp tránh lỗi chứng chỉ SSL khi kết nối ở môi trường dev
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=HorseTransportDB;encrypt=true;trustServerCertificate=true;

# Thông tin đăng nhập
spring.datasource.username=sa
spring.datasource.password=12345

# ==========================================
# CẤU HÌNH JPA / HIBERNATE
# ==========================================

# Hiển thị câu lệnh SQL trong console để dễ debug
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Chiến lược tự động tạo/cập nhật bảng (Lựa chọn: none, update, create, create-drop, validate)
# Khuyến nghị: dùng 'update' cho môi trường dev, 'none' hoặc 'validate' cho production
spring.jpa.hibernate.ddl-auto=update

# Dialect cho MS SQL Server (Hibernate 6/7 dùng SQLServerDialect; SQLServer2012Dialect đã bị gỡ)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

server.port=8084